<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon (Separador do browser no computador e favoritos) -->
    <link rel="icon" type="image/png" href="/marca/21-icone-sem-moldura.png" />

    <!-- Web App Manifest (PWA para Android / Chromium com o atalho "Condomínio") -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon (Atalho no ecrã principal iOS Safari / iPhone com o título "Condomínio") -->
    <link rel="apple-touch-icon" sizes="180x180" href="/marca/21-icone-sem-moldura.png" />
    <link rel="apple-touch-icon" href="/marca/21-icone-sem-moldura.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Condomínio" />

    <!-- PWA Mobile Browser Meta -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Condomínio" />
    <meta name="theme-color" content="#10b981" />

    <!-- Preconnect a origens externas críticas, para poupar a latência de ligação (DNS/TLS) quando o pedido real chega -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!-- Google Fonts: carregado diretamente aqui (não via @import em CSS) para ser descoberto de imediato
         pelo preload scanner do browser, em vez de só depois do CSS/JS principal serem processados -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />

    <!-- Pré-carregar a imagem de LCP (logo do ecrã de login) diretamente do HTML: como está dentro de um
         componente React, o browser só a descobriria depois de carregar e executar o bundle JS principal -->
    <link rel="preload" as="image" href="/marca/02-versao-horizontal.webp" fetchpriority="high" />

    <!-- Font Awesome Icons: carregado de forma assíncrona (media="print" + onload) para não bloquear o
         primeiro render — são só ícones decorativos, não conteúdo crítico -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" /></noscript>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bento Rodrigues2</title>
    <meta name="description" content="Plataforma de gestão de condomínios com automatização de AI. Powered by CondoManager AI." />
    <meta property="og:title" content="Bento Rodrigues2" />
    <meta property="og:description" content="Plataforma de gestão de condomínios com automatização de AI. Powered by CondoManager AI." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
